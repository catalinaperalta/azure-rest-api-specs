name: "TypeSpec Breaking Change - Analyze Code"

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Full base commit SHA. Dispatch against the PR head branch."
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install normal specs repository dependencies
        uses: ./.github/actions/setup-node-install-deps
        with:
          node-version: "26.x"

      - name: Check out pinned upstream tool and compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Azure/typespec-azure
          ref: 7f56fcca7fcf28734c6338c27f3fb5b747636215
          path: .breaking-change-upstream
          submodules: true
          persist-credentials: false

      - name: Build unpublished CLI and compatible TypeSpec libraries
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: .breaking-change-upstream/package.json

      - name: Compile unpublished upstream packages
        working-directory: .breaking-change-upstream
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm -r --filter '@azure-tools/typespec-breaking-change...' --filter '@azure-tools/typespec-azure-resource-manager...' --filter '@typespec/openapi3...' build

      - name: Analyze both phases and retain raw results
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        shell: bash
        run: |
          [[ "$BASE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "A full base commit SHA is required"; exit 2; }
          node .github/workflows/src/typespec-breaking-change-demo/analyze.ts \
            "$GITHUB_WORKSPACE/.breaking-change-upstream" "$BASE_REF" "$RUNNER_TEMP/compatibility-report"

      - name: Upload complete analysis report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typespec-breaking-change-demo
          path: ${{ runner.temp }}/compatibility-report/
          if-no-files-found: warn
